[project]
name = "aion-6g"
version = "0.1.0"
description = "AI-native intent orchestrator for cloud-edge systems"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.2",
  "pydantic==2.9.2",
  "uvicorn==0.31.0",
  "pytest==8.3.4",
  "httpx==0.27.0",
  "psutil==5.9.8",
  "PyYAML==6.0.2",
  "python-dotenv==1.0.1",
  "requests==2.32.0",
  "matplotlib==3.8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "docker: requires the isolated AION-6G Docker Compose project",
  "kubernetes: requires the isolated aion-6g-cluster kind cluster",
]
