apiVersion: apps/v1
kind: Deployment
metadata:
  name: aion6g-worker
  namespace: aion-6g
  labels:
    app: aion6g-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aion6g-worker
  template:
    metadata:
      labels:
        app: aion6g-worker
    spec:
      containers:
        - name: aion6g-worker
          image: aion6g-worker:validation
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn", "app.workers.worker_api:app", "--host", "0.0.0.0", "--port", "8001"]
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: AION_EXECUTION_MODE
              value: KUBERNETES
            - name: AION_CLUSTER_NAME
              value: aion-6g-cluster
            - name: AION_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: AION_DEPLOYMENT
              value: aion6g-worker
            - name: AION_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: AION_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: AION_CONTAINER_NAME
              value: aion6g-worker
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aion6g-worker
  namespace: aion-6g
spec:
  type: ClusterIP
  selector:
    app: aion6g-worker
  ports:
    - name: http
      port: 8001
      targetPort: http
